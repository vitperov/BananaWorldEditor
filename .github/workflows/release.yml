name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # No checkout: the action reads the tag from the GitHub context and only
      # publishes release metadata (auto-generated notes, automatic source
      # archives).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
